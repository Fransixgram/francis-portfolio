<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b17" />
    <meta
      name="description"
      content="Portfolio of CHIDUBEM FRANCIS, Full-stack Software Engineer."
    />
    <title>CHIDUBEM FRANCIS | Full-stack Software Engineer</title>
    <script>
      // Dark is the default theme. If the visitor previously chose light, apply it
      // here, before the page paints, so there is no dark-to-light flash.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.remove('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
